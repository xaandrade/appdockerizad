<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Dockerizada</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .container { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        .badge { padding: 10px 20px; border-radius: 5px; color: white; font-weight: bold; font-size: 1.2em; }
        .MAIN { background-color: #28a745; }
        .QA { background-color: #ffc107; color: black; }
        .DEV { background-color: #17a2b8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>¡Hola desde Python y Docker!</h1>
        <p>Esta aplicación se está ejecutando en el entorno:</p>
        <span class="badge {{ entorno }}">{{ entorno }}</span>
    </div>
</body>
</html>
